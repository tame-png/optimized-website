    <script>
      // Sets the tide before the first paint so the page never flashes the wrong theme.
      // Keep the hours and colours in step with src/tide/tides.js.
      (function () {
        try {
          var saved = localStorage.getItem('tide');
          var h = new Date().getHours();
          var auto = h >= 6 && h < 16 ? 'low-tide' : h < 20 ? 'golden-hour' : 'high-tide';
          var tide = saved && saved !== 'auto' ? saved : auto;
          document.documentElement.setAttribute('data-theme', tide);
          var chrome = { 'low-tide': '#fbf9f5', 'golden-hour': '#f4ebd9', 'high-tide': '#161b22' }[tide];
          var metas = document.querySelectorAll('meta[name="theme-color"]');
          if (chrome) for (var i = 0; i < metas.length; i++) { metas[i].removeAttribute('media'); metas[i].setAttribute('content', chrome); }
        } catch (e) {}
      })();
    </script>
